<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>記事詳細</title>

</head>

<body>

    <div th:replace="~{fragment/layout :: header}"></div>

    <div class="detail-container">
        <img th:if="${post.imagePath != null}" th:src="@{${post.imagePath}}" class="post-image">

        <h1 th:text="${post.title}"></h1>
        <p class="content" th:text="${post.content}"></p>

    </div>

    <form th:action="@{/post/{id}/delete(id=${post.id})}" method="post"
        onsubmit="return confirm('本当にこの記事を削除してもよろしいですか？');">
        <button type="submit" class="delete-btn">この記事を削除する</button>
    </form>

</body>

</html>
