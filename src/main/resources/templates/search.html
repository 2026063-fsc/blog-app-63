<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <div th:replace="~{fragment/layout :: head('検索')}"></div>
</head>


<body>

    <header>
        <nav>
            <a th:href="@{/}">ホーム</a>
            <a th:href="@{/search}">検索</a>
            <a class="plus-button" th:href="@{/post/new}">＋</a>
        </nav>
    </header>

    <h2>検索</h2>

    <form th:action="@{/search}" method="get">
        <input type="text" name="keyword" placeholder="検索キーワードを入力">
        <button type="submit">検索</button>
    </form>

    <hr>
    <h3>検索結果</h3>

    <div th:if="${posts != null}">

        <p th:if="${#lists.isEmpty(posts)} and ${keyword != null}" class="no-result">
            「<span th:text="${keyword}"></span>」に一致する投稿は見つかりませんでした。
        </p>

        <div class="post-cards" th:each="post : ${posts}">
            <h3>
                <a th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}"></a>
            </h3>
            <p th:text="${#strings.abbreviate(post.content, 100)}"></p>
            <div th:if="${post.imagePath}">
                <img th:src="@{/images/{name}(name=${post.imagePath})}" alt="投稿画像" class="post-images" />
            </div>
        </div>

    </div>
</body>

</html>
