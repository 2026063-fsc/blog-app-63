<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/layout :: head('ホーム')}" />

<body>

    <header>
        <nav>
            <a th:href="@{/}">ホーム</a>
            <a th:href="@{/search}">検索</a>
            <a class="plus-button" th:href="@{/post/new}">＋</a>
        </nav>
    </header>

    <h2>投稿一覧</h2>

    <div class="post-card" th:each="post:${posts}">
        <h3>
            <a th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}"></a>
        </h3>
        <p th:text="${#strings.abbreviate(post.content,100)}"></p>

    </div>

</body>

</html>
